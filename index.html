<body>
  <div id="root"></div>

  <script type="module">
    import * as React from 'https://cdn.jsdelivr.net/npm/react@18.3.1/+esm';
    import * as ReactDOM from 'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/+esm';

    // ===== DATA =====
    const Hl = {
      both: "sayed.png",
      c1: "sayed1.png",
      c2: "sayed2.png",
      c3: "sayed3.png",
      c4: "sayed4.png"
    };

    const gt = [{
      id: 1,
      label: "الفصل الأول",
      title: "البداية",
      img: Hl.c1,
      date: "15 / 09 / 2008",
      text: "اليوم اللي نور فيه الكون",
      sub: "طفل اتولد وفي عينيه حكاية كبيرة مستنياه. كل حاجة بدأت من هنا.",
      effect: "glitch"
    }, {
      id: 2,
      label: "الفصل الثاني",
      title: "الرحلة",
      img: Hl.c2,
      date: "2008 → 2024",
      text: "من عيل صغير ل...",
      sub: "سنين بتجري، ضحكة بتكبر، وملامح بقت رجولة. الرحلة كانت تقيلة بس انت قدها.",
      effect: "polaroid"
    }, {
      id: 3,
      label: "الفصل الثالث",
      title: "الهيبة",
      img: Hl.c3,
      date: "الآن",
      text: "السكوت من دهب... بس قصتك لسه بتبدأ",
      sub: "النظرة دي فيها كلام كتير. مش محتاج تتكلم، هيبتك بتتكلم عنك.",
      effect: "whisper"
    }, {
      id: 4,
      label: "الفصل الرابع",
      title: "النهاردة",
      img: Hl.c4,
      date: "15 / 09 / 2026",
      text: "18 سنة - STWD",
      sub: "خلاص بقيت راجل. 18 سنة عدت، واللي جاي كله ليك. ارفع راسك.",
      effect: "counter"
    }];

    // ===== IMAGE COMPONENT =====
    function Img({ src, alt, className, style, fallbackLabel }) {
      const [error, setError] = React.useState(false);
      if (error) {
        return React.createElement('div', {
          className: `${className || ''} flex flex-col items-center justify-center bg-gradient-to-br from-[#1e1e1e] via-[#111] to-[#0a0a0a] border border-[#FFD700]/15`,
          style: style,
          children: [
            React.createElement('div', { className: 'w-10 h-10 rounded-full bg-[#FFD700]/10 border border-[#FFD700]/20 flex items-center justify-center mb-2', children: React.createElement('span', { className: 'text-[#FFD700] text-[10px] font-black', children: 'IMG' }) }),
            React.createElement('div', { className: 'text-[10px] text-white/30 font-bold tracking-widest', children: fallbackLabel || alt }),
            React.createElement('div', { className: 'text-[9px] text-white/20 mt-1', children: src })
          ]
        });
      }
      return React.createElement('img', { src, alt, className, style, onError: () => setError(true), loading: 'eager' });
    }

    // ===== MAIN APP =====
    function App() {
      const [step, setStep] = React.useState('lock');
      const [pass, setPass] = React.useState('');
      const [errorPass, setErrorPass] = React.useState(false);
      const [giftOpen, setGiftOpen] = React.useState(false);
      const [chapterIndex, setChapterIndex] = React.useState(0);
      const [typedTexts, setTypedTexts] = React.useState(['', '', '', '']);
      const [isPlaying, setIsPlaying] = React.useState(false);
      const [candles, setCandles] = React.useState(Array(18).fill(false));
      const [wishRevealed, setWishRevealed] = React.useState(false);
      const [counter, setCounter] = React.useState(0);
      const audioRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const canvas2Ref = React.useRef(null);

      // Typing effect
      React.useEffect(() => {
        if (step !== 'timeline') return;
        const currentText = gt[chapterIndex].text;
        let idx = 0;
        setTypedTexts(prev => {
          const next = [...prev];
          next[chapterIndex] = '';
          return next;
        });
        const interval = setInterval(() => {
          idx++;
          setTypedTexts(prev => {
            const next = [...prev];
            next[chapterIndex] = currentText.slice(0, idx);
            return next;
          });
          if (idx >= currentText.length) clearInterval(interval);
        }, 45);
        return () => clearInterval(interval);
      }, [chapterIndex, step]);

      // Counter effect
      React.useEffect(() => {
        if (step === 'timeline' && chapterIndex === 3) {
          let count = 0;
          const interval = setInterval(() => {
            count++;
            setCounter(count);
            if (count >= 18) clearInterval(interval);
          }, 80);
          return () => clearInterval(interval);
        }
      }, [step, chapterIndex]);

      // Final canvas
      React.useEffect(() => {
        if (step !== 'final') return;
        const canvas1 = canvasRef.current;
        const canvas2 = canvas2Ref.current;
        if (!canvas1 || !canvas2) return;

        const ctx1 = canvas1.getContext('2d');
        const ctx2 = canvas2.getContext('2d');
        let particles = [];
        let fireworks = [];
        let animationId;

        const resize = () => {
          const dpr = window.devicePixelRatio || 1;
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas1.width = w * dpr;
          canvas1.height = h * dpr;
          canvas2.width = w * dpr;
          canvas2.height = h * dpr;
          canvas1.style.width = w + 'px';
          canvas1.style.height = h + 'px';
          canvas2.style.width = w + 'px';
          canvas2.style.height = h + 'px';
          ctx1.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        window.addEventListener('resize', resize);

        const stars = Array.from({ length: 120 }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * -window.innerHeight,
          r: Math.random() * 6 + 3,
          color: ['#FFD700', '#fff', '#ffcc00', '#a67c00'][Math.floor(Math.random() * 4)],
          vy: Math.random() * 2 + 1.5,
          vx: (Math.random() - 0.5) * 2,
          rot: Math.random() * 360
        }));

        const spawnFirework = () => {
          const x = Math.random() * window.innerWidth * 0.8 + window.innerWidth * 0.1;
          const y = window.innerHeight;
          const tx = Math.random() * window.innerWidth;
          const ty = Math.random() * window.innerHeight * 0.5;
          fireworks.push({ x, y, tx, ty, vx: (tx - x) * 0.02, vy: (ty - y) * 0.02, life: 1, exploded: false, trail: [] });
        };

        let frameCount = 0;
        const animate = () => {
          animationId = requestAnimationFrame(animate);
          frameCount++;

          ctx1.fillStyle = 'rgba(10,10,10,0.15)';
          ctx1.fillRect(0, 0, window.innerWidth, window.innerHeight);
          ctx2.clearRect(0, 0, window.innerWidth, window.innerHeight);

          stars.forEach(s => {
            s.y += s.vy;
            s.x += s.vx;
            s.rot += 2;
            if (s.y > window.innerHeight) { s.y = -20;
              s.x = Math.random() * window.innerWidth; }
            ctx2.save();
            ctx2.translate(s.x, s.y);
            ctx2.rotate(s.rot * Math.PI / 180);
            ctx2.fillStyle = s.color;
            ctx2.fillRect(-s.r / 2, -s.r / 2, s.r, s.r * 1.6);
            ctx2.restore();
          });

          if (frameCount % 25 === 0) spawnFirework();

          fireworks = fireworks.filter(f => f.life > 0);

          fireworks.forEach(f => {
            if (!f.exploded) {
              f.trail.push({ x: f.x, y: f.y });
              if (f.trail.length > 6) f.trail.shift();
              f.x += f.vx;
              f.y += f.vy;
              f.vy += 0.15;

              if (Math.hypot(f.x - f.tx, f.y - f.ty) < 20 || f.vy > 0) {
                f.exploded = true;
                for (let i = 0; i < 60; i++) {
                  const angle = Math.PI * 2 * i / 60;
                  const speed = Math.random() * 4 + 1;
                  fireworks.push({
                    x: f.x,
                    y: f.y,
                    vx: Math.cos(angle) * speed + (Math.random() - 0.5),
                    vy: Math.sin(angle) * speed + (Math.random() - 0.5),
                    life: 1,
                    exploded: true,
                    isSpark: true,
                    color: Math.random() > 0.5 ? '#FFD700' : '#ffffff'
                  });
                }
              } else {
                ctx1.beginPath();
                ctx1.strokeStyle = '#FFD700';
                ctx1.lineWidth = 2;
                ctx1.moveTo(f.trail[0]?.x ?? f.x, f.trail[0]?.y ?? f.y);
                f.trail.forEach(p => ctx1.lineTo(p.x, p.y));
                ctx1.stroke();
              }
            } else if (f.isSpark) {
              f.x += f.vx;
              f.y += f.vy;
              f.vy += 0.05;
              f.vx *= 0.98;
              f.life -= 0.015;
              ctx1.globalAlpha = f.life;
              ctx1.fillStyle = f.color;
              ctx1.beginPath();
              ctx1.arc(f.x, f.y, 2, 0, Math.PI * 2);
              ctx1.fill();
              ctx1.globalAlpha = 1;
            }
          });
        };

        animate();
        return () => {
          cancelAnimationFrame(animationId);
          window.removeEventListener('resize', resize);
        };
      }, [step]);

      // Handle pass
      const checkPass = () => {
        if (pass.trim() === '2008' || pass.includes('2008')) {
          setStep('gift');
          if (audioRef.current) {
            audioRef.current.muted = true;
            audioRef.current.play().catch(() => {});
          }
        } else {
          setErrorPass(true);
          setTimeout(() => setErrorPass(false), 500);
        }
      };

      // Gift open
      const openGift = () => {
        setGiftOpen(true);
        setTimeout(() => {
          setStep('timeline');
          setChapterIndex(0);
        }, 900);
      };

      // Toggle audio
